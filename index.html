<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>osiviewer-vite-js</title>
    <style>
html, body {
  margin: 0;
  height: 100%;
  background: #222;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color: rgb(220,220,220);
}

/* Main layout */
#app {
  height: 100vh;
  width: 100vw;
  overflow: hidden;
}

#container {
  display: flex;
  width: 100%;
  height: 100%;
}

/* LEFT SIDEBAR */

#sidebar {
  width: 400px; /* Starting width (slightly wider as requested) */
  min-width: 200px;
  max-width: 800px;
  background: #1e1e1e;
  border-right: 1px solid rgba(255,255,255,0.08);
  display: flex;
  flex-direction: column;
  overflow: hidden; /* Prevents tree from pushing sidebar width */
  pointer-events: all; /* This is usually the default, but good to be sure */
  z-index: 20
}

#resizer {
  width: 4px;
  cursor: col-resize;
  background: rgba(255, 255, 255, 0.05);
  transition: background 0.2s;
  z-index: 10;
}

#resizer:hover {
  background: rgba(74, 158, 255, 0.5); /* Blue highlight on hover */
}

/* File loader row */

.fileRow {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}

.file-button {
  padding: 6px 12px;
  background: rgb(60,60,60);
  border-radius: 4px;
  cursor: pointer;
  font-size: 0.9em;
}

.file-button:hover {
  background: rgb(90,90,90);
}

#fileName {
  font-size: 0.9em;
  color: rgb(200,200,200);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Tree container */

.treeContainer {
  flex: 1;
  overflow-x: hidden;
  overflow-y: auto;
}

/* Tree styling */

.tree {
  list-style: none;
  margin: 0;
  padding: 6px 0;
  font-size: 0.85em;
}

.tree li {
  padding: 2px 0;
  cursor: pointer;
  position: relative;
}

.tree li > .caret:hover,
.tree li > .node-key:hover,
.tree li > .leaf-value:hover {
    background: rgba(165, 30, 30, 0.308);
    border-radius: 0px;
}

.tree li:hover {
  background: transparent;
}

/* Expand arrows */

.tree .node::before {
  content: "+";
  display: inline-block;
  width: 14px;
  color: rgb(150,150,150);
}

.tree .node.open::before {
  content: "-";
}

/* Children */

.tree ul {
  list-style: none;
  margin: 0;
  padding-left: 16px;
  display: none;
}

.tree .node.open > ul {
  display: block;
}

/* 3D viewer */

#viewer {
  flex: 1;
  position: relative;
  background: #000;
  min-width: 0; /* Important for flex child shrinking */
}

#viewer canvas {
  width: 100% !important;
  height: 100% !important;
  display: block;
}

@keyframes flash-green {
    0% { background-color: rgba(46, 204, 113, 0.4); }
    100% { background-color: transparent; }
}

.updated-flash > span.caret, 
.updated-flash > .leaf-value {
    animation: flash-green 1.0s ease-out;
}

/* Optional: Ensure the flash doesn't bleed into nested open children */
.node {
    transition: background-color 0.2s;
}

.node-key {
    font-weight: bold;
    color: #efefef; /* Slightly brighter to pop against the background */
}

/* Optional: add a tiny bit of space after the colon */
.node-key {
    margin-right: 4px;
}

/* Ensure the caret span (which contains the key for parent nodes) is also bold */
.caret .node-key {
    font-weight: bold;
}

    </style>
    </head>
  <body>
    <div id="app">
      <!-- LEFT SIDEBAR -->
      <div id="container">
        <div id="sidebar">

          <div class="fileRow">
            <input type="file" id="fileInput" accept=".osi,.pb" hidden />
            <label for="fileInput" class="file-button">Load</label>
            <span id="fileName">No file</span>
          </div>

          <div class="treeContainer">
            <ul id="gtTree" class="tree"></ul>
          </div>

        </div>
        <div id="resizer"></div>
        <!-- 3D VIEW -->
        <div id="viewer"></div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
