<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>osiviewer-vite-js</title>
    <link rel="stylesheet" href="/src/styles/main.css" />
    </head>
  <body>
    <div id="app">
      <!-- LEFT SIDEBAR -->
      <div id="container">
        <div id="sidebar">

          <div class="fileRow">
            <input type="file" id="fileInput" accept=".osi,.pb" hidden />
            <label for="fileInput" class="file-button">Load</label>
            <span id="fileName">No file</span>
          </div>

          <div class="treeContainer">
            <ul id="gtTree" class="tree"></ul>
          </div>

        </div>
        <div id="resizer"></div>
        <!-- 3D VIEW -->
        <div id="viewer"></div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
