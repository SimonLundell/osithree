<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>osiviewer-vite-js</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background-color: rgb(34, 34, 34);
      }
      .file-button {
        display: inline-block;
        padding: 8px 14px;
        background-color: rgb(60, 60, 60);
        color: white;
        border-radius: 4px;
        cursor: pointer;
        font-family: sans-serif;
        font-size: 0.9em;
      }
      .file-button:hover {
        background-color: rgb(90, 90, 90);
      }
      .fileRow {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 0.9em;
      }
      #ObjectId,
      #ObjectPos,
      #ObjectSpeed,
      #ObjectOrientation,
      #osiTimestamp,
      #projString,
      #mapReference,
      #xodrModelReference,
      #osiVersion,
      #fileName {
        margin-left: 1px;
        color: rgb(200, 200, 200);
        font-size: 0.9em;
      }
      .ui {
        display: flex;
        align-items: flex-start;
        height: 74px;
        background-color: rgba(34, 34, 34);
        padding: 12px 16px;
        font-family: sans-serif;
      }
      .label {
        color: rgb(150, 150, 150);
      }
      .metaRow,
      .version {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 0.9em;
      }

      .metaRow .label {
        flex: 0 0 auto;     /* label keeps its natural width */
      }

      .metaRow span:last-child {
        flex: 1;            /* value takes remaining space */
        min-width: 0;       /* VERY important for ellipsis in flex */
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .metaLeft {
        display: flex;
        flex-direction: column;
        gap: 3px;
        font-size: 0.9em;
      }

      .metaCenterLeft {
        display: flex;
        flex-direction: column;
        gap: 3px;
        margin: 0 auto;
        font-size: 0.9em;
        max-width: 300px;
      }

      .metaCenter {
        display: flex;
        flex-direction: column;
        gap: 3px;
        margin: 0 auto;
        font-size: 0.9em;
        max-width: 400px;
      }

      .metaCenterRight {
        display: flex;
        flex-direction: column;
        gap: 3px;
        margin: 0 auto;
        min-width: 250px;
        font-size: 0.9em;
      }

      .metaRight {
        display: flex;
        flex-direction: column;
        gap: 3px;
        margin-left: auto;
        justify-content: flex-end;
        height: 100%;
        font-size: 0.9em;
        min-width: 250px;
        text-align: right;
      }

      /* Right content */
      .dg {
        position: fixed !important;
        top: 90px;
        right: 0px
      }

      .copyable {
        cursor: pointer;
        transition: opacity 0.15s ease;
      }

      .copyable:hover {
        text-decoration: underline;
      }

      .copyable.copied {
        opacity: 0.6;
      }

    </style>
  </head>
  <body>
    <div class="ui">
      <div class="metaLeft">
        <div class="fileRow">
          <input type="file" id="fileInput" accept=".osi,.pb" hidden />
          <label for="fileInput" class="file-button">Load OSI file</label>
          <span id="fileName">No file selected</span>
        </div>

        <div class="version">
          <span class="label">OSI file version: </span>
          <span id="osiVersion"> </span>
        </div>
      </div>

      <div class="metaCenterLeft">
        <div class="metaRow">
          <span class="label">modelReference:</span>
          <span id="xodrModelReference" class="copyable"></span>
        </div>
        <div class="metaRow">
          <span class="label">mapReference:</span>
          <span id="mapReference" class="copyable"></span>
        </div>
        <div class="metaRow">
          <span class="label">projString:</span>
          <span id="projString" class="copyable"></span>
        </div>
      </div>

      <div class="metaCenterRight">
        <div class="metaRow">
          <span class="label">ObjectId:</span>
          <span id="ObjectId"></span>
        </div>
        <div class="metaRow">
          <span class="label">ObjectPos (x,y,z):</span>
          <span id="ObjectPos"></span>
        </div>
        <div class="metaRow">
          <span class="label">ObjectSpeed (x,y,z):</span>
          <span id="ObjectSpeed"></span>
        </div>
        <div class="metaRow">
          <span class="label">ObjectAngle (h,p,r):</span>
          <span id="ObjectOrientation"></span>
        </div>
      </div>

      <div class="metaRight">
        <div class="metaRow">
          <span class="label">Timestamp: </span>
          <span id="osiTimestamp"> </span>
        </div>
      </div>

    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
