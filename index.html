<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>osiviewer-vite-js</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background-color: rgb(34, 34, 34);
        overflow: hidden;
      }
      #viewer {
        position: absolute;
        inset: 0;
        z-index: 0;
      }

      #viewer canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      .file-button {
        display: inline-block;
        padding: 8px 14px;
        background-color: rgb(60, 60, 60);
        color: white;
        border-radius: 4px;
        cursor: pointer;
        font-family: sans-serif;
        font-size: 0.9em;
      }
      .file-button:hover {
        background-color: rgb(90, 90, 90);
      }
      .fileRow {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 0.9em;
      }
      #osiTimestamp,
      #projString,
      #mapReference,
      #xodrModelReference,
      #osiVersion,
      #fileName {
        margin-left: 1px;
        color: rgb(200, 200, 200);
        font-size: 0.9em;
      }
      .banner {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;

        height: 90px;

        display: flex;
        align-items: stretch;
        pointer-events: none;

        padding: 12px 16px;

        background: #1e1e1e;

        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: rgb(220,220,220);

        z-index: 20;
      }
      .label {
        color: rgb(150, 150, 150);
      }
      .metaRow,
      .version {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 0.9em;
      }

      .metaRow .label {
        flex: 0 0 auto;     /* label keeps its natural width */
      }

      .metaRow span:last-child {
        flex: 1;            /* value takes remaining space */
        min-width: 0;       /* VERY important for ellipsis in flex */
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .metaLeft {
        display: flex;
        flex-direction: column;
        gap: 3px;
        max-width: 300px
      }

      .metaCenterLeft {
        display: flex;
        flex-direction: column;
        gap: 3px;
        margin: 0 auto;
        max-width: 300px;
      }

      .metaRight {
        display: flex;
        flex-direction: column;
        margin-left: auto;
        justify-content: flex-end;  /* pushes content to bottom */
        align-items: flex-end;      /* right align */
        text-align: right;
        min-width: 250px;
      }

      .metaCenterLeft {
        border-left: 1px solid rgba(255,255,255,0.08);
        padding-left: 16px;
      }

      /* Right content */
      .dg {
        position: absolute !important;
        top: 114px;
        right: 0px;
        z-index: 25 !important;
      }

      .copyable {
        cursor: pointer;
        transition: opacity 0.15s ease;
      }

      .copyable:hover {
        text-decoration: underline;
      }

      .copyable.copied {
        opacity: 0.6;
      }

      .hidden {
        display: none;
      }

      .banner {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 90px;
        background: #1e1e1e;
      }

      .sidebar {
        position: absolute;

        top: 90px;
        left: 0;
        bottom: 0;

        width: 300px;

        background: #202020;
        border-right: 1px solid rgba(255,255,255,0.06);

        overflow-y: auto;

        transition: transform 0.25s ease;

        z-index: 15;
      }

      .sidebarHeader {
        padding: 10px 12px;
        font-size: 0.85em;
        color: rgb(170,170,170);
        border-bottom: 1px solid rgba(255,255,255,0.05);
      }

      .sidebar.collapsed {
        transform: translateX(-100%);
      }

      #sidebarToggle {
        position: absolute;

        top: 96px;
        left: 6px;

        z-index: 30;

        background: #2a2a2a;
        border: 1px solid rgba(255,255,255,0.15);

        color: rgba(255,255,255,0.7);

        font-size: 11px;

        padding: 2px 6px;

        border-radius: 3px;

        cursor: pointer;
      }

      #sidebarToggle:hover {
        color: white;
        border-color: rgba(255,255,255,0.5);
      }

      .tree {
        list-style: none;
        margin: 0;
        padding: 6px 0;
        font-size: 0.85em;
      }

      .tree li {
        padding: 3px 12px;
        cursor: pointer;
      }

      .tree li:hover {
        background: rgba(255,255,255,0.05);
      }

      .file-button,
      #fileInput,
      .copyable,
      #sidebarToggle {
        pointer-events: auto;
      }

    </style>
    </head>
    <body>

    <!-- TOP BANNER -->
    <div class="banner">

      <div class="metaLeft">
        <div class="fileRow">
          <input type="file" id="fileInput" accept=".osi,.pb" hidden />
          <label for="fileInput" class="file-button">Load OSI file</label>
          <span id="fileName">No file selected</span>
        </div>

        <div class="version">
          <span class="label">OSI file version:</span>
          <span id="osiVersion"></span>
        </div>
      </div>


      <div class="metaCenterLeft">
        <div class="odrTitle">Road data</div>

        <div class="metaRow">
          <span class="label">modelReference:</span>
          <span id="xodrModelReference" class="copyable"></span>
        </div>

        <div class="metaRow">
          <span class="label">mapReference:</span>
          <span id="mapReference" class="copyable"></span>
        </div>

        <div class="metaRow">
          <span class="label">projString:</span>
          <span id="projString" class="copyable"></span>
        </div>
      </div>


      <div class="metaRight">
        <div class="metaRow">
          <span class="label">Timestamp:</span>
          <span id="osiTimestamp" class="copyable"></span>
        </div>
      </div>

    </div>


      <!-- 3D scene container -->
    <div id="viewer"></div>

    <!-- SIDEBAR TOGGLE -->
    <button id="sidebarToggle" class="sidebarToggleBtn" title="Show Ground Truth">
      ▶
    </button>


    <!-- SIDEBAR -->
    <div id="sidebar" class="sidebar collapsed">
      <div class="sidebarHeader">Ground Truth</div>
      <ul id="gtTree" class="tree"></ul>
    </div>

  <script type="module" src="/src/main.js"></script>
  </body>
</html>
