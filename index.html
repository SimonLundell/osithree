<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>osiviewer-vite-js</title>
    <style>
html, body {
  margin: 0;
  height: 100%;
  background: #222;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color: rgb(220,220,220);
}

/* Main layout */
#app {
  display: flex;
  height: 100vh;
}

/* LEFT SIDEBAR */

#sidebar {
  width: 300px;
  background: #1e1e1e;
  border-right: 1px solid rgba(255,255,255,0.08);

  display: flex;
  flex-direction: column;
}

/* File loader row */

.fileRow {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}

.file-button {
  padding: 6px 12px;
  background: rgb(60,60,60);
  border-radius: 4px;
  cursor: pointer;
  font-size: 0.9em;
}

.file-button:hover {
  background: rgb(90,90,90);
}

#fileName {
  font-size: 0.9em;
  color: rgb(200,200,200);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Tree container */

.treeContainer {
  flex: 1;
  overflow-y: auto;
}

/* Tree styling */

.tree {
  list-style: none;
  margin: 0;
  padding: 6px 0;
  font-size: 0.85em;
}

.tree li {
  padding: 4px 12px;
  cursor: pointer;
}

.tree li:hover {
  background: rgba(255,255,255,0.05);
}

/* Expand arrows */

.tree .node::before {
  content: "▸";
  display: inline-block;
  width: 14px;
  color: rgb(150,150,150);
}

.tree .node.open::before {
  content: "▾";
}

/* Children */

.tree ul {
  list-style: none;
  margin: 0;
  padding-left: 16px;
  display: none;
}

.tree .node.open > ul {
  display: block;
}

/* 3D viewer */

#viewer {
  flex: 1;
  position: relative;
}

#viewer canvas {
  width: 100%;
  height: 100%;
  display: block;
}
    </style>
    </head>
  <body>
    <div id="app">

      <!-- LEFT SIDEBAR -->
      <div id="sidebar">

        <div class="fileRow">
          <input type="file" id="fileInput" accept=".osi,.pb" hidden />
          <label for="fileInput" class="file-button">Load</label>
          <span id="fileName">No file</span>
        </div>

        <div class="treeContainer">
          <ul id="gtTree" class="tree"></ul>
        </div>

      </div>

      <!-- 3D VIEW -->
      <div id="viewer"></div>

    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
